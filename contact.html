<body data-page="contact"> 

    <header>
        <a href="/" style="cursor: pointer;" class="signature">
            <img
                src="./assets/signature.png"
                alt="tanda tangan gw" />
        </a>
        <nav>
            <ul id="nav-items"></ul>
        </nav>
        <div class="header-actions">
            <a 
                id="contact-btn" 
                class="contact-btn" 
                href="./contact.html">
                Contact Me
            </a>
            <button
                id="play-bg"
                type="button"
                aria-label="Play background music"
                aria-pressed="false"
                class="play-btn"
            >
                <span id="play-icon" aria-hidden="true"></span>
            </button>
            <button
                id="menu-btn"
                class="menu-btn"
                type="button"
                aria-label="Toggle menu"
                aria-expanded="false"
                aria-controls="menu-overlay"
            >
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>
        <section class="contact-page" aria-labelledby="contact-title">
            <div class="contact-page__info">
                <h1 id="contact-title" class="contact-page__title"></h1>
                <p id="contact-intro" class="contact-page__intro"></p>

                <dl class="contact-page__meta">
                    <div>
                        <dt id="contact-email-label"></dt>
                        <dd><a id="contact-email" href="#"></a></dd>
                    </div>
                    <div>
                        <dt id="contact-location-label"></dt>
                        <dd id="contact-location"></dd>
                    </div>
                </dl>
            </div>

            <form id="contact-form" class="contact-form" novalidate>
                <fieldset class="contact-form__group">
                    <legend id="need-legend"></legend>
                    <div id="need-options" class="chips"></div>
                    <p class="field__error" data-error-for="need" role="alert"></p>
                </fieldset>

                <fieldset class="contact-form__group">
                    <legend id="budget-legend"></legend>
                    <div id="budget-options" class="chips"></div>
                    <p class="field__error" data-error-for="budget" role="alert"></p>
                </fieldset>

                <div class="field">
                    <label id="name-label" class="visually-hidden" for="contact-name"></label>
                    <input id="contact-name" name="name" type="text" autocomplete="name">
                    <p class="field__error" data-error-for="name" role="alert"></p>
                </div>

                <div class="field">
                    <label id="email-label" class="visually-hidden" for="contact-mail"></label>
                    <input id="contact-mail" name="email" type="email" autocomplete="email">
                    <p class="field__error" data-error-for="email" role="alert"></p>
                </div>

                <div class="field">
                    <label id="message-label" class="visually-hidden" for="contact-message"></label>
                    <textarea id="contact-message" name="message" rows="4"></textarea>
                    <p class="field__error" data-error-for="message" role="alert"></p>
                </div>

                <button id="contact-submit" class="contact-form__submit" type="submit"></button>
                <p id="contact-status" class="contact-form__status" role="status"></p>
            </form>
        </section>
    </main>

    <!-- footer -->
    <footer>

        <!-- copyright -->
        <div class="footer-copyright">
            <span id="copyright-icon"></span>
            <span id="copyright-year"></span>
            Althaf Mulya.
            Designing systems, not just writing code.
        </div>

        <!-- lower -->
        <div class="footer-lower">
            <span id="current-time"></span>
            <button id="back-to-top" class="back-to-top" type="button">
                BACK TO TOP <span aria-hidden="true">↑</span>
            </button>
        </div>

    </footer>

    <!-- additional components -->
    <audio id="background-audio" loop preload="auto">
        <source src="./assets/castle-town.mp3" type="audio/mpeg">
    </audio>

    <div class="scroll-progress">
        <span id="scroll-percentage">0%</span>
        <div class="scroll-progress__track">
            <div id="scroll-progress-bar"></div>
        </div>
    </div>

    <div id="menu-overlay" class="menu-overlay" aria-hidden="true">
        <ol id="menu-items" class="menu-items"></ol>
    </div>

</body>
</html>
