<body data-page="capabilities">

    <!-- header -->
    <header>
        <a href="/" style="cursor: pointer;" class="signature">
            <img
                src="./assets/signature.png"
                alt="tanda tangan gw" />
        </a>
        <nav>
            <ul id="nav-items"></ul>
        </nav>
        <div class="header-actions">
            <a 
                id="contact-btn" 
                class="contact-btn" 
                href="./contact.html">
                Contact Me
            </a>
            <button
                id="play-bg"
                type="button"
                aria-label="Play background music"
                aria-pressed="false"
                class="play-btn"
            >
                <span id="play-icon" aria-hidden="true"></span>
            </button>
            <button
                id="menu-btn"
                class="menu-btn"
                type="button"
                aria-label="Toggle menu"
                aria-expanded="false"
                aria-controls="menu-overlay"
            >
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>
        <section class="capabilities section-container-for-capabilities" aria-labelledby="capabilities-title">
            <div class="capabilities__header">
                <h1 id="capabilities-title" class="capabilities__title"></h1>
                <p id="capabilities-lead" class="capabilities__lead"></p>
            </div>

            <div class="capabilities__scroll" tabindex="0" role="region" aria-label="Tabel capabilities">
                <table id="capabilities-table" class="cap-table">
                    <caption id="capabilities-caption" class="visually-hidden"></caption>
                    <thead>
                        <tr id="capabilities-head"></tr>
                    </thead>
                </table>
            </div>

            <p id="capabilities-note" class="capabilities__note"></p>
        </section>

        <!-- nav to contact -->
        <section class="contact section-container" id="contact">
            <h3 class="contact__title">Sudah menemukan pilihan mu?</h3>
            <p class="contact__subtitle">
                Hubungi aku dan tulis detail yang kamu inginkan.
            </p>
            <a class="contact__cta" href="./contact.html">
                Let's start it <span aria-hidden="true">→</span>
            </a>
        </section>

    </main>

    <!-- footer -->
    <footer>

        <!-- copyright -->
        <div class="footer-copyright">
            <span id="copyright-icon"></span>
            <span id="copyright-year"></span>
            Althaf Mulya.
            Designing systems, not just writing code.
        </div>

        <!-- lower -->
        <div class="footer-lower">
            <span id="current-time"></span>
            <button id="back-to-top" class="back-to-top" type="button">
                BACK TO TOP <span aria-hidden="true">↑</span>
            </button>
        </div>

    </footer>

    <!-- additional components -->
    <audio id="background-audio" loop preload="auto">
        <source src="./assets/castle-town.mp3" type="audio/mpeg">
    </audio>

    <div class="scroll-progress">
        <span id="scroll-percentage">0%</span>
        <div class="scroll-progress__track">
            <div id="scroll-progress-bar"></div>
        </div>
    </div>

    <div id="menu-overlay" class="menu-overlay" aria-hidden="true">
        <ol id="menu-items" class="menu-items"></ol>
    </div>
